# ================================================================
# Nginx 配置 — chat-agent.conf
# ================================================================
# 部署到 /etc/nginx/sites-available/chat-agent.conf
# 然后创建软链接：ln -s /etc/nginx/sites-available/chat-agent.conf /etc/nginx/sites-enabled/
#
# SSL 证书由 certbot 自动管理：
#   certbot --nginx -d your-domain.com
# ================================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name your-domain.com;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书（由 certbot 自动填入实际路径）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ================================================================
    # 静态文件（前端 HTML/CSS/JS）
    # ================================================================
    location /css/ {
        alias /opt/chat-agent/frontend/css/;
        expires 7d;
    }

    location /js/ {
        alias /opt/chat-agent/frontend/js/;
        expires 7d;
    }

    location = /favicon.ico {
        alias /opt/chat-agent/frontend/favicon.ico;
        try_files $uri =204;
    }

    # ================================================================
    # API 反向代理 → FastAPI (127.0.0.1:8000)
    # ================================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # 基础代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ SSE 关键配置：禁用缓冲，否则流式输出会卡住
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 分块传输编码（流式必需）
        chunked_transfer_encoding on;
    }

    # ================================================================
    # 根路径（前端页面）
    # ================================================================
    location = / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 日志
    access_log /var/log/nginx/chat-agent-access.log;
    error_log  /var/log/nginx/chat-agent-error.log;
}
